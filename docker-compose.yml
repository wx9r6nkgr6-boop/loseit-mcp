services:
  loseit-mcp:
    build: .
    image: loseit-mcp:local
    ports:
      - "8000:8000"
    environment:
      PORT: "8000"
    volumes:
      # An owner-only liauth file on the host; never bake it into the image.
      - "${LOSEIT_TOKEN_FILE:?set LOSEIT_TOKEN_FILE}:/home/app/.config/loseit-readonly/liauth:ro"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    # The MCP server itself writes nothing; the token mount is also read-only.
    read_only: true
    security_opt:
      - no-new-privileges:true
